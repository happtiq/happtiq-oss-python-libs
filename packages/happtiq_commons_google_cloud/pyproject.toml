[build-system]
requires      = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "happtiq_commons_google_cloud"
requires-python = ">=3.9"
readme = "README.md"
description = "[DEPRECATED] Utilities for integrating Python services with Google Cloud components."
dynamic = ["version"]
classifiers = [
    "Development Status :: 7 - Inactive"
]
dependencies = [
    'google-cloud-storage',
    'cloudevents',
    'google-cloud-logging',
    'google-auth',
    'google-auth-oauthlib',
    'google-cloud-pubsub',
    'google-cloud-secret-manager'
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock"
]

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"

[tool.happtiq]
maintenance_status = "deprecated"
deprecation_announced = "2026-04-16"
eol = "2026-10-16"
